name: Docs structure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structure:
    name: Required files present
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify required files
        run: |
          set -euo pipefail
          fail=0
          for f in LICENSE README.md PARENT.md docs/UNIT_CORRECTION.md \
                   tables/seeds.csv tables/not_seeds.csv \
                   tables/broad_grading.csv tables/lefschetz_orthogonality.csv; do
            if [ -e "$f" ]; then echo "ok   $f"; else echo "MISS $f"; fail=1; fi
          done
          exit "$fail"

      - name: Seeds list must not contain dummy fills
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, sys
          bad = {"0", "1", "6", "1/6"}
          with open("tables/seeds.csv", newline="") as f:
              rows = list(csv.reader(f))
          hits = [(i + 1, c) for i, r in enumerate(rows) for c in r if c.strip() in bad]
          if hits:
              print("dummy numeral parked in tables/seeds.csv:", hits)
              sys.exit(1)
          PY
          echo "seeds.csv has no 0 / 1 / 6 / 1/6 fills"
