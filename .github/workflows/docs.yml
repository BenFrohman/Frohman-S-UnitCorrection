name: Docs structure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structure:
    name: Required files present
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify required files
        run: |
          set -euo pipefail
          fail=0
          for f in LICENSE README.md PARENT.md docs/UNIT_CORRECTION.md \
                   tables/seeds.csv tables/not_seeds.csv \
                   tables/broad_grading.csv tables/lefschetz_orthogonality.csv; do
            if [ -e "$f" ]; then echo "ok   $f"; else echo "MISS $f"; fail=1; fi
          done
          exit "$fail"

      - name: Seeds list must not contain dummy fills
        run: |
          set -euo pipefail
          if grep -Eiq '(^|,)(0|1|6|1/6)($|,)' tables/seeds.csv; then
            echo "dummy numeral parked in tables/seeds.csv"
            exit 1
          fi
          echo "seeds.csv has no 0 / 1 / 6 / 1/6 fills"
