name: Docs structure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Required files present
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify ledger files
        run: |
          set -e
          fail=0
          for f in LICENSE README.md PARENT.md docs/UNIT_CORRECTION.md; do
            if [ -e "$f" ]; then echo "ok   $f"; else echo "MISS $f"; fail=1; fi
          done
          echo "--- tables ---"
          for f in tables/seeds.csv tables/broad_grading.csv tables/allowed_36.csv tables/off_rule_180.csv tables/three_points_W_42.csv; do
            if [ -e "$f" ]; then echo "ok   $f"; else echo "MISS $f"; fail=1; fi
          done
          exit $fail

      - name: Locked ranks still 25, 26, 30
        run: |
          set -e
          grep -q ',25,' tables/seeds.csv || grep -q '25' tables/seeds.csv
          echo "seeds.csv present; ranks documented in UNIT_CORRECTION.md"
          grep -q '25' docs/UNIT_CORRECTION.md
          grep -q '26' docs/UNIT_CORRECTION.md
          grep -q '30' docs/UNIT_CORRECTION.md
          echo "locked ranks mentioned"
